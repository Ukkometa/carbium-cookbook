# Runs every example against the live Carbium API.
#
# The value of this repo is that nothing in it is untested copy-paste, so a
# broken example must fail here rather than in someone else's terminal.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   CARBIUM_RPC_KEY   RPC key  (sent as the ?apiKey= query parameter)
#   CARBIUM_API_KEY   Swap key (sent as the X-API-KEY header) — a DIFFERENT key
#
# Use keys dedicated to CI with tight rate limits, not the ones you develop with.
name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — catches upstream drift weekly
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Fail early and legibly when the repo has no secrets, rather than letting
      # every recipe skip and surfacing it as a generic exit 1.
      - name: Check secrets are present
        env:
          RPC: ${{ secrets.CARBIUM_RPC_KEY }}
          API: ${{ secrets.CARBIUM_API_KEY }}
        run: |
          missing=0
          [ -z "$RPC" ] && { echo "::error::CARBIUM_RPC_KEY secret is not set"; missing=1; }
          [ -z "$API" ] && { echo "::error::CARBIUM_API_KEY secret is not set"; missing=1; }
          if [ "$missing" = "1" ]; then
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "Use keys dedicated to CI with tight rate limits."
            exit 1
          fi
          echo "both secrets present"

      - run: node verify.mjs
        env:
          CARBIUM_RPC_KEY: ${{ secrets.CARBIUM_RPC_KEY }}
          CARBIUM_API_KEY: ${{ secrets.CARBIUM_API_KEY }}
