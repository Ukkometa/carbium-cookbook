# Runs every example against the live Carbium API.
#
# The value of this repo is that nothing in it is untested copy-paste, so a
# broken example must fail here rather than in someone else's terminal.
#
# Requires one repository secret (Settings → Secrets and variables → Actions):
#   CARBIUM_SH_KEY   a key from carbium.sh. One key covers every recipe.
#                     The account needs the Quote module for the Swap API recipes.
#                     The Carbon Stream recipes need a Dev plan or above and
#                     the gRPC scope on the key.
#
# Where the plan allows more than one key, use a key dedicated to CI, not the
# one you develop with.
name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — catches upstream drift weekly
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Fail early and legibly when the repo has no secret, rather than letting
      # every recipe skip and surfacing it as a generic exit 1.
      - name: Check the secret is present
        env:
          KEY: ${{ secrets.CARBIUM_SH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::CARBIUM_SH_KEY secret is not set"
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "It must be a key from carbium.sh."
            exit 1
          fi
          echo "secret present"

      - run: node verify.mjs
        env:
          CARBIUM_SH_KEY: ${{ secrets.CARBIUM_SH_KEY }}
